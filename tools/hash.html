<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Generador de hashes SHA-256</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.17 0.008 70);
      --surface: oklch(0.22 0.01 70);
      --line: oklch(0.32 0.012 70);
      --text: oklch(0.97 0.004 70);
      --muted: oklch(0.72 0.01 70);
      --accent: oklch(0.8 0.15 78);
      --accent-ink: oklch(0.2 0.03 78);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: start center;
      padding: 36px 16px;
    }
    main { width: min(620px, 100%); }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 16px; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text); }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 8px; }
    input {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
    }
    input:focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }
    .out {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: .9rem;
      word-break: break-all;
      min-height: 3.2em;
      color: var(--accent);
    }
    button {
      margin-top: 16px;
      font: inherit;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 999px;
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 2px dashed var(--text); outline-offset: 3px; }
    .back { display: inline-block; margin-top: 24px; color: var(--muted); }
    .back:focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Generador de hashes SHA-256</h1>
    <p>Escribe la contraseña o el PIN. El hash de la caja de abajo es el que va en <code>config.js</code>. Nada de esto sale de tu navegador.</p>

    <label for="input">Texto</label>
    <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="pajas2026" />

    <div class="out" id="out" aria-live="polite">—</div>
    <button id="copy" type="button">Copiar hash</button>

    <a class="back" href="../index.html">Volver al marcador</a>
  </main>

  <script>
    const input = document.getElementById("input");
    const out = document.getElementById("out");
    const copy = document.getElementById("copy");

    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    async function update() {
      const value = input.value;
      if (!value) { out.textContent = "—"; return; }
      out.textContent = await sha256Hex(value);
    }

    input.addEventListener("input", update);

    copy.addEventListener("click", async () => {
      if (!input.value) return;
      const hash = await sha256Hex(input.value);
      try {
        await navigator.clipboard.writeText(hash);
        copy.textContent = "Copiado";
      } catch {
        copy.textContent = "Copia manualmente";
      }
      setTimeout(() => { copy.textContent = "Copiar hash"; }, 1600);
    });
  </script>
</body>
</html>
